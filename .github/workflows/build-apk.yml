name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Run unit tests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SmartLauncher.apk

      # 发布到 Releases 页面，手机浏览器可直接下载安装
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 智能桌面 第 ${{ github.run_number }} 版
          body: 用手机下载下面的 SmartLauncher.apk，点开即可安装。
          files: SmartLauncher.apk
          make_latest: true
