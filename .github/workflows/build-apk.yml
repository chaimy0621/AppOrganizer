name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Run unit tests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SmartLauncher.apk

      # Publish to the Releases page so the APK can be downloaded straight from a phone browser
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Smart Launcher build ${{ github.run_number }}
          body: Download SmartLauncher.apk below on your phone and tap it to install.
          files: SmartLauncher.apk
          make_latest: true
